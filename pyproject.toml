[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-health-agent"
version = "1.0.0"
description = "AI project health reporting agent for messy Excel project plans."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Janakiraman K" }]
dependencies = [
  "pandas>=2.2.0",
  "openpyxl>=3.1.2",
  "python-pptx>=0.6.23",
  "jinja2>=3.1.3",
  "pydantic>=2.6.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "matplotlib>=3.8.0",
  "plotly>=5.19.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
